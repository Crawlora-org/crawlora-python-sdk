name: Publish PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve versions
        id: versions
        run: |
          pkg="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])
          PY
          )"
          echo "package=$pkg" >> "$GITHUB_OUTPUT"
          # Tag v1.3.0-sdk.1 must map to PEP 440 package version 1.3.0.dev1.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            expected="$(python3 - "${GITHUB_REF_NAME#v}" <<'PY'
          import re, sys
          m = re.fullmatch(r"(\d+\.\d+\.\d+)-sdk\.(\d+)", sys.argv[1])
          print(f"{m.group(1)}.dev{m.group(2)}" if m else "")
          PY
          )"
            if [ -z "$expected" ] || [ "$expected" != "$pkg" ]; then
              echo "Tag ${GITHUB_REF_NAME} (-> ${expected:-invalid}) does not match package version ${pkg}" >&2
              exit 1
            fi
          fi
          echo "Publishing crawlora==${pkg}"
      - name: Regenerate SDK
        run: python3 scripts/generate.py
      - name: Check generated files
        run: git diff --exit-code
      - name: Test
        run: python3 -m unittest discover -s tests
      - name: Build distributions
        run: |
          python3 -m pip install --upgrade build
          python3 -m build --sdist --wheel
      - name: Check whether version already on PyPI
        id: exists
        run: |
          if curl -sf "https://pypi.org/pypi/crawlora/${{ steps.versions.outputs.package }}/json" >/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "crawlora==${{ steps.versions.outputs.package }} already on PyPI; skipping publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to PyPI
        if: steps.exists.outputs.published == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
