[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlora"
version = "1.2.0.sdk1"
description = "Python SDK for the public Crawlora API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["crawlora*"]

[tool.setuptools.package-data]
crawlora = ["py.typed"]
