[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlora"
version = "1.25.0.dev1"
description = "Official Python SDK for the Crawlora web-scraping API: typed grouped and dynamic operation calls for every public endpoint, with retries, pagination, hooks, and an async client."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Crawlora" },
]
keywords = [
  "crawlora",
  "crawlora-sdk",
  "web-scraping",
  "scraping",
  "scraper",
  "web-scraper",
  "api",
  "api-client",
  "rest-api",
  "rest-api-client",
  "sdk",
  "client",
  "data-extraction",
  "serp",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "typing-extensions>=4.8; python_version < '3.11'",
]

[project.optional-dependencies]
# True non-blocking async transport for AsyncCrawloraClient.
async = ["httpx>=0.27"]

[project.urls]
Homepage = "https://crawlora.net/?utm_source=pypi&utm_medium=referral&utm_campaign=crawlora-python-sdk"
Documentation = "https://crawlora.net/docs"
Repository = "https://github.com/Crawlora-org/crawlora-python-sdk"
Issues = "https://github.com/Crawlora-org/crawlora-python-sdk/issues"

[tool.setuptools.packages.find]
include = ["crawlora*"]

[tool.setuptools.package-data]
crawlora = ["py.typed", "*.pyi"]
