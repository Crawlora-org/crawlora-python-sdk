[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlora"
version = "1.2.0.dev3"
description = "Python SDK for the public Crawlora API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "typing-extensions>=4.8; python_version < '3.11'",
]

[tool.setuptools.packages.find]
include = ["crawlora*"]

[tool.setuptools.package-data]
crawlora = ["py.typed", "*.pyi"]
